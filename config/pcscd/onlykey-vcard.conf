# OnlyKey virtual smartcard reader configuration for pcscd
#
# Install to /etc/reader.conf.d/onlykey-vcard.conf (or include path configured
# in /etc/reader.conf), then restart pcscd.
#
# PREREQUISITE: ifd-vpcd must be installed.
#   Debian/Ubuntu: apt install ifd-vpcd
#   Arch:          paru -S ifd-vpcd
#
# onlykey-vcard must be running before pcscd loads this config.
# Use the provided systemd unit: systemctl --user enable --now onlykey-vcard
#
# Port assignments match onlykey-vcard defaults:
#   OpenPGP Card applet: TCP 127.0.0.1:35963
#   PIV applet:          TCP 127.0.0.1:35964

FRIENDLYNAME "OnlyKey OpenPGP"
DEVICENAME   /dev/null
LIBPATH      /usr/lib/pcsc/drivers/ifd-vpcd.so
CHANNELID    35963

FRIENDLYNAME "OnlyKey PIV"
DEVICENAME   /dev/null
LIBPATH      /usr/lib/pcsc/drivers/ifd-vpcd.so
CHANNELID    35964
